var step = 'loc';
function paintSteps(){
  var b = $('stepBar');
  if (!b) return;
  b.innerHTML = (step === 'loc' ? '<b>'+esc(T('stepLoc'))+'</b> <s>·</s> '+esc(T('stepArr'))
                                : esc(T('stepLoc'))+' <s>·</s> <b>'+esc(T('stepArr'))+'</b>');
}
/* Nad grafmi stačí vedieť, kde a čo — technické parametre patria do nastavení. */
var fetchedAt = null;

/* Čas poslednej aktualizácie sa vypisuje v jazyku rozhrania a v čase
   používateľa, nie v čase elektrárne — hovorí o tom, kedy sa dáta
   stiahli, nie o tom, čoho sa týkajú. */
function stamp(){
  if (!fetchedAt) return '';
  try {
    return new Intl.DateTimeFormat(I18N[lang].locale, {
      day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'
    }).format(fetchedAt);
  } catch(e){
    var h = fetchedAt.getHours(), m = fetchedAt.getMinutes();
    return fetchedAt.getDate() + '. ' + (fetchedAt.getMonth()+1) + '. '
      + (h<10?'0':'') + h + ':' + (m<10?'0':'') + m;
  }
}

function paintHeader(){
  $('siteLoc').textContent = cfg.place || '—';
  $('siteTag').textContent = T('tagline');
  var meta = $('infoMeta');
  if (meta){
    if (fetchedAt){
      meta.innerHTML = esc(T('updated', { d: stamp(), s: '\u0000' }))
        .replace('\u0000', '<a href="https://open-meteo.com/en/docs" target="_blank" rel="noopener">Open-Meteo</a>');
      meta.classList.remove('hidden');
    } else meta.classList.add('hidden');
  }
  var d = $('setSub');
  if (d) d.textContent = ready()
    ? (cfg.place || '—') + ' · ' + num(totalKwp(),2) + ' ' + T('kwp')
      + ' · ' + cfg.strings.length + '× ' + T('stringN') + ' · ' + num(cfg.acLimit,1) + ' kW'
    : '';
}

function paintLocation(){
  if (!$('lName')) return;
  $('lName').textContent = cfg.place || '–';
  $('lSub').textContent = cfg.placeSub || '';
}
function showOnly(id){
  ['setup','loading','error','app','settings'].forEach(function(k){
    $(k).classList[k === id ? 'remove' : 'add']('hidden');
  });
  // horná lišta má zmysel len tam, kde je čo obnovovať alebo nastavovať
  var t = $('openSettings'), r = $('reload'), i = $('infoBtn');
  var onApp = (id === 'app' || id === 'settings');
  t.classList[onApp ? 'remove' : 'add']('hidden');
  r.classList[id === 'app' ? 'remove' : 'add']('hidden');
  i.classList[id === 'app' ? 'remove' : 'add']('hidden');
  if (id !== 'app') setInfo(false);
}
function gotoArray(){
  step = 'arr'; paintSteps();
  $('stLoc').classList.add('hidden');
  $('stArr').classList.remove('hidden');
  if (cfg.strings.length){ $('pickMode').classList.add('hidden'); $('editor').classList.remove('hidden');
    renderStrings('strList','tKwp','tPan'); fillGlobals('f_'); }
}

function fillGlobals(pfx){
  $(pfx+'ac').value = cfg.acLimit; $(pfx+'eff').value = cfg.eff; $(pfx+'tc').value = cfg.tempCoef;
}
function readGlobals(pfx){
  var a = parseFloat($(pfx+'ac').value), e = parseFloat($(pfx+'eff').value),
      t = parseFloat($(pfx+'tc').value);
  var changed = false;
  if (isFinite(a) && a > 0){ if (a !== cfg.acLimit) changed = true; cfg.acLimit = a; }
  if (isFinite(e) && e > 0 && e <= 1){ if (e !== cfg.eff) changed = true; cfg.eff = e; }
  if (isFinite(t)){ if (t !== cfg.tempCoef) changed = true; cfg.tempCoef = t; }
  if (changed) touchedByUser();
}
function validateArray(msgId){
  var m = $(msgId);
  cfg.strings = cfg.strings.filter(function(s){ return s.panels > 0 && s.wp > 0; });
  if (!cfg.strings.length){
    m.className = 'msg bad';
    m.textContent = T('needStr');
    return false;
  }
  m.className = 'msg bad hidden';
  return true;
}

/* ============================================================
   RENDER + BOOT
   ============================================================ */
function render(){
  drawSummary(); drawDial(); drawHeat(); drawBars(); drawTabs(); drawCurve(); drawTable();
  // Editor v nastaveniach musí sedieť s tým, čo je práve zobrazené — inak
  // zostane po úvodnom nastavení prázdny až do obnovenia stránky.
  if ($('settings').classList.contains('hidden')){
    renderStrings('strList2','tKwp2','tPan2');
    fillGlobals('g_');
    paintLocation();
    paintSuggestNote();
    closeResetBox();
  }
}

function boot(){
  hideTip();
  if (!ready()){
    showOnly('setup');
    if (!hasPlace()){ step='loc'; paintSteps();
      $('stLoc').classList.remove('hidden'); $('stArr').classList.add('hidden'); }
    else gotoArray();
    return;
  }
  showOnly('loading');
  getForecast().then(function(api){
    model = buildModel(api);
    if (!model.days.length) throw new Error('No usable hourly data returned.');
    fetchedAt = new Date();
    sel = 0;
    showOnly('app');
    render();
  }).catch(function(e){
    showOnly('error');
    $('errMsg').textContent = (e && e.message) ? e.message : T('searchFail');
  });
}

tipEl = $('tip');
document.addEventListener('scroll', hideTip, true);
/* Zmena šírky okna aj otočenie telefónu menia rozmery grafov,
   preto sa prekresľujú všetky. Prekreslenie sa zdrží, aby sa
   pri plynulom ťahaní okna nespúšťalo pri každom pixeli. */
var reflowTimer = null, lastW = window.innerWidth;
function scheduleReflow(force){
  clearTimeout(reflowTimer);
  reflowTimer = setTimeout(function(){
    if (!model) return;
    if (!force && window.innerWidth === lastW) return;
    lastW = window.innerWidth;
    hideTip();
    drawDial(); drawHeat(); drawBars(); drawCurve();
  }, 140);
}
window.addEventListener('resize', function(){ scheduleReflow(false); });
window.addEventListener('orientationchange', function(){ setTimeout(function(){ scheduleReflow(true); }, 260); });
// prepnutie obrazovky mení dostupnú šírku, grafy sa musia premerať
function reflowNow(){ scheduleReflow(true); }

$('lang').addEventListener('change', function(){
  lang = $('lang').value; cfg.lang = lang; save();
  applyLang();
  if (model) render();
  if (!$('strList').closest('.hidden')) renderStrings('strList','tKwp','tPan');
  if (model) renderStrings('strList2','tKwp2','tPan2');
});

  renderStrings('strList2','tKwp2','tPan2');
  fillGlobals('g_');

  paintSuggestNote();
  paintThemeUI();
  paintHeader();

  showOnly('settings');
  window.scrollTo(0, 0);
  reflowNow();

$('backLoc').addEventListener('click', function(){
  step = 'loc'; paintSteps();
  $('stArr').classList.add('hidden'); $('stLoc').classList.remove('hidden');
});
$('finish').addEventListener('click', function(){
  readGlobals('f_');
  if (!validateArray('edMsg')) return;
  save(); boot();
});

$('addStr2').addEventListener('click', function(){
  addString(); renderStrings('strList2','tKwp2','tPan2'); drawDial();
});
$('suggest').addEventListener('click', function(){
  var opt = optimalSetup(cfg.lat, cfg.lon);
  cfg.strings.forEach(function(s){ s.tilt = opt.tilt; s.az = opt.az; });
  renderStrings('strList2','tKwp2','tPan2'); drawDial();
  var m = $('gMsg'); m.className = 'msg'; m.classList.remove('hidden');
  m.textContent = T('optDone',{t:opt.tilt, a:opt.az});
});
$('apply').addEventListener('click', leaveSettings);

/* ============================================================
   VYMAZANIE ZADANÝCH ÚDAJOV

   Dvojkrokové: prvý klik len odkryje varovanie s tým, čo sa stratí,
   samotné vymazanie prebehne až po druhom potvrdení. Jazyk ostáva
   nastavený tak, ako ho má používateľ práve zvolený — inak by po
   vymazaní skončil na obrazovke v jazyku, ktorý možno nečíta.
   ============================================================ */
$('resetOpen').addEventListener('click', function(){
  $('resetBox').classList.remove('hidden');
  $('resetOpen').classList.add('hidden');
  $('resetGo').focus();
});
$('resetNo').addEventListener('click', closeResetBox);
function closeResetBox(){
  $('resetBox').classList.add('hidden');
  $('resetOpen').classList.remove('hidden');
}

$('resetGo').addEventListener('click', function(){
  var keepLang = lang;
  try { localStorage.removeItem(STORE); } catch(e){}
  cfg = defaultCfg();
  cfg.lang = keepLang;
  model = null;
  sel = 0;

  closeResetBox();
  closeLocEdit();

  // úvodné nastavenie vrátiť do stavu, v akom je pri prvom spustení
  step = 'loc';
  $('stLoc').classList.remove('hidden');
  $('stArr').classList.add('hidden');
  $('pickMode').classList.remove('hidden');
  $('editor').classList.add('hidden');
  $('edMsg').classList.add('hidden');
  $('gMsg').classList.add('hidden');
  $('q').value = '';
  $('qRes').innerHTML = '';
  $('qRes').classList.add('hidden');
  $('strList').innerHTML = '';
  $('strList2').innerHTML = '';
  paintSuggestNote();
  fillGlobals('f_');

  var m = $('qMsg');
  m.className = 'msg';
  m.textContent = T('resetDone');

  showOnly('setup');
  boot();
});

/* ---- štart ---- */
load();
lang = detectLang();
applyTheme();
applyLang();
if (ready()){ renderStrings('strList2','tKwp2','tPan2'); fillGlobals('g_'); }
boot();

})();
</script>
</body>
</html>
