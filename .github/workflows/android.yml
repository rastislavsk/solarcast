name: Android

on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'index.html', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # No keystore.properties here, so this produces an unsigned bundle. Its
      # job is to prove the build, the Kotlin compile and lintVital all pass —
      # the artefact that goes to Play is signed locally with the upload key.
      - name: Build release bundle
        working-directory: android
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Run lint
        working-directory: android
        run: ./gradlew :app:lintRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: solarcast-aab-unsigned
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: android/app/build/reports/lint-results-release.html
          if-no-files-found: ignore
